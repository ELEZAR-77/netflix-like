databaseChangeLog:
  - changeSet:
      id: 0003-add-movies-table
      author: OMAR
      changes:
        - createTable:
            tableName: movies
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: duration_seconds
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: release_date
                  type: DATE
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: video_path
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: poster_path
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                    unique: false
