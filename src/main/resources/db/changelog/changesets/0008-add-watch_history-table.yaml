databaseChangeLog:
  - changeSet:
      id: 0008-add-wathch_history-table
      author: OMAR
      changes:
        - createTable:
            tableName: watch_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: movie_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: position_seconds
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: completed
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: last_watched_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: watch_history
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_watch_history_user

        - addForeignKeyConstraint:
            baseTableName: watch_history
            baseColumnNames: movie_id
            referencedTableName: movies
            referencedColumnNames: id
            constraintName: fk_watch_history_movie

        - addUniqueConstraint:
            tableName: watch_history
            columnNames: user_id, movie_id
            constraintName: uk_watch_history_user_movie